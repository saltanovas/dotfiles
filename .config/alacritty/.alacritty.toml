# See https://alacritty.org/config-alacritty.html

[general]
import = []
working_directory = "/Users/saltanovas/desktop/p"
live_config_reload = true
ipc_socket = true

[font]
# Perfect fit on x/y-axis using both 'Buttonless-Maximized' and 'Fullscreen' windows on my Mac
size = 16.0
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
bold_italic = { family = "JetBrainsMono Nerd Font", style = "Bold Italic" }

[window]
# "SimpleFullscreen" hides menu bar on ALL monitors
# "Fullscreen" does not make a window transparent, black just gets lighter
startup_mode = "Maximized" # Windowed | Maximized | Fullscreen | SimpleFullscreen
decorations = "Buttonless" # Full | None | Transparent | Buttonless

padding = { x = 0, y = 0 }
dynamic_padding = true
opacity = 1.0
blur = true
option_as_alt = "Both"

[scrolling]
history = 10000
multiplier = 1

[cursor]
style.shape = "Block"
style.blinking = "Never"
unfocused_hollow = true
thickness = 0.15

[bell]
animation = "EaseOut"
duration = 450
color = "#101010"

[terminal]
shell.program = "/opt/homebrew/bin/tmux"
shell.args = [
    "new-session",
    "-As", "p", # [a]ttach to the [s]ession 'p' if it exists or create it
    "-n", "main" # name the initial window 'main' if session is created
]

[keyboard]
bindings = [
    # Editing
    { key = "z", mods = "Command", chars = "\u001F" },
    { key = "c", mods = "Command", chars = "\u001b[99~" },
    { key = "x", mods = "Command", chars = "\u001b[100~" },
    { key = "Return", mods = "Shift", chars = "\u001b\r" },

    # Shift
    { key = "Left", mods = "Shift", chars = "\u001b[1;2D" },
    { key = "Right", mods = "Shift", chars = "\u001b[1;2C" },

    # Option
    { key = "Back", mods = "Alt", chars = "\u001b\u007f" },
    { key = "Left", mods = "Alt", chars = "\u001bb" },
    { key = "Right", mods = "Alt", chars = "\u001bf" },
    { key = "Left", mods = "Alt|Shift", chars = "\u001b[1;4D" },
    { key = "Right", mods = "Alt|Shift", chars = "\u001b[1;4C" },

    # Command
    { key = "Up", mods = "Command", chars = "\u001b[97~" },
    { key = "Down", mods = "Command", chars = "\u001b[98~" },
    { key = "Left", mods = "Command", chars = "\u001bOH" },
    { key = "Right", mods = "Command", chars = "\u001bOF" },
    { key = "Back", mods = "Command", chars = "\u0015" },

    # Command + Shift
    { key = "Up", mods = "Command|Shift", chars = "\u001b[1;10A" },
    { key = "Down", mods = "Command|Shift", chars = "\u001b[1;10B" },
    { key = "Left", mods = "Command|Shift", chars = "\u001b[1;10D" },
    { key = "Right", mods = "Command|Shift", chars = "\u001b[1;10C" },
]
