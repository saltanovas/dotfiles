globinclude conf.d/*.conf
include themes/Afterglow.conf
shell $HOME/.local/bin/start-tmux

# Fonts
font_family JetBrainsMono Nerd Font Mono
bold_font auto
italic_font auto
bold_italic_font auto
font_size 15
macos_thicken_font 0.5
disable_ligatures always

# Window
hide_window_decorations titlebar-only
macos_option_as_alt yes
macos_quit_when_last_window_closed yes
confirm_os_window_close 0
startup_session startup.kitty-session
remember_window_size no

# Scrolling
scrollback_lines 10000
wheel_scroll_multiplier 1.0
touch_scroll_multiplier 1.0

# Cursor
cursor_shape block
cursor_blink_interval 0
cursor_shape_unfocused hollow

# Bell
enable_audio_bell no
visual_bell_duration 0.45 step-start ease-out
visual_bell_color #343030

# Fine font zoom
map cmd+equal change_font_size all +0.5
map cmd+plus change_font_size all +0.5
map shift+cmd+equal change_font_size all +0.5
map cmd+minus change_font_size all -0.5
