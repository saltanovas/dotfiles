# ── Theme palette ─────────────────────────────────────────────
set -g @theme-bg       '#1E1F22'
set -g @theme-fg       '#E6EDF3'
set -g @theme-inactive '#45494F'
set -g @theme-active   '#FF963D'
set -g @theme-session  '#4DA6FF'

# ── Symbols ───────────────────────────────────────────────────
set -g @separator-right      ''
set -g @separator-left       ''
set -g @separator-thin-right ''
set -g @separator-thin-left  ''

# ── General status bar ────────────────────────────────────────
set -g status on
set -g status-position bottom
set -g status-interval 1
set -g status-justify left
set -g window-status-separator ''

# -F expands the theme variables when this option is assigned.
set -gF status-style 'bg=#{@theme-bg},fg=#{@theme-fg}'

# ── Session block ─────────────────────────────────────────────
set -g status-left-length 20

set -g status-left \
  '#[fg=#{@theme-bg},bg=#{@theme-session},bold] #S #[fg=#{@theme-session},bg=#{@theme-bg}]#{@separator-right}#[bg=#{@theme-bg}]'

# ── Inactive windows ──────────────────────────────────────────
set -g window-status-format \
  '#[fg=#{@theme-bg},bg=#{@theme-inactive}]#{@separator-right}#[fg=#{@theme-fg},bg=#{@theme-inactive}] #I #{@separator-thin-right} #W #F#[fg=#{@theme-inactive},bg=#{@theme-bg}]#{@separator-right}#[bg=#{@theme-bg}]'

# ── Active window ─────────────────────────────────────────────
set -g window-status-current-format \
  '#[fg=#{@theme-bg},bg=#{@theme-active}]#{@separator-right}#[fg=#{@theme-bg},bg=#{@theme-active},bold] #I #{@separator-thin-right} #W #F #[fg=#{@theme-active},bg=#{@theme-bg}]#{@separator-right}#[bg=#{@theme-bg}]'

# ── Right side ────────────────────────────────────────────────
set -g status-right-length 100

set -g status-right \
  '#[fg=#{@theme-inactive},bg=#{@theme-bg}]#{@separator-left}#[fg=#{@theme-fg},bg=#{@theme-inactive}] %Y-%m-%d #{@separator-thin-left} %H:%M #[fg=#{?client_prefix,#{@theme-active},#{@theme-inactive}},bg=#{@theme-inactive}]#{@separator-left}#[fg=#{?client_prefix,#{@theme-bg},#{@theme-fg}},bg=#{?client_prefix,#{@theme-active},#{@theme-inactive}},bold]#{user} #[fg=#{?client_prefix,#{@theme-active},#{@theme-inactive}},bg=#{@theme-bg}]'
